# Server settings. A line like `port = ${?PORT}` means:
# "if the PORT environment variable exists, use it instead of the value above".
# This lets the same code run on your PC and on a real server.
ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [com.splitapp.ApplicationKt.module]
  }
}

database {
  url = "jdbc:postgresql://localhost:5432/splitapp"
  url = ${?DATABASE_URL}
  user = "splitapp"
  user = ${?DATABASE_USER}
  password = "splitapp_dev_password"
  password = ${?DATABASE_PASSWORD}
}

jwt {
  # Only for local development! On the real server, set the JWT_SECRET environment variable.
  secret = "dev-only-secret-change-me-in-production"
  secret = ${?JWT_SECRET}
  issuer = "splitapp"
  audience = "splitapp-users"
  realm = "splitapp"
  expiresInDays = 30
}
